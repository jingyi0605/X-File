<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/x-file-logo.svg" />
    <title>X-File</title>
    <style>
      :root {
        color-scheme: light;
        --startup-bg: #fafafa;
        --startup-window-bg:
          radial-gradient(ellipse at 100% 0%, rgba(194, 215, 234, 0.2), transparent 50%),
          radial-gradient(ellipse at 0% 100%, rgba(228, 225, 220, 0.18), transparent 45%),
          #ffffff;
        --startup-sidebar-bg:
          linear-gradient(160deg, rgba(255, 255, 255, 0.36), transparent 72%),
          rgba(252, 252, 252, 0.68);
        --startup-detail-bg:
          linear-gradient(160deg, rgba(255, 255, 255, 0.42), transparent 65%),
          rgba(255, 255, 255, 0.55);
        --startup-main-bg: #ffffff;
        --startup-border: rgba(0, 0, 0, 0.025);
        --startup-muted-border: transparent;
        --startup-panel-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.85);
        --startup-toolbar-height: 52px;
        --startup-blur: blur(58px) saturate(190%);
      }

      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--startup-bg);
      }

      body {
        font-family: "SF Pro Text", "SF Pro SC", "PingFang SC", "Helvetica Neue", -apple-system, BlinkMacSystemFont, sans-serif;
      }

      #startup-shell {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        grid-template-rows: 1fr;
        pointer-events: none;
        background: var(--startup-window-bg);
        opacity: 1;
        transition: opacity 160ms ease;
      }

      #startup-shell[data-state="ready"] {
        opacity: 0;
      }

      #startup-shell[data-state="hidden"] {
        display: none;
      }

      .startup-shell-window {
        display: grid;
        grid-template-columns: 240px minmax(0, 1fr) 340px;
        width: 100%;
        height: 100%;
        min-height: 0;
        overflow: hidden;
        background: var(--startup-window-bg);
      }

      .startup-shell-sidebar,
      .startup-shell-detail {
        min-height: 0;
        box-shadow: var(--startup-panel-shadow);
        backdrop-filter: var(--startup-blur);
        -webkit-backdrop-filter: var(--startup-blur);
      }

      .startup-shell-sidebar {
        border-right: 1px solid var(--startup-border);
        background: var(--startup-sidebar-bg);
      }

      .startup-shell-main {
        min-height: 0;
        background: var(--startup-main-bg);
      }

      .startup-shell-detail {
        border-left: 1px solid var(--startup-border);
        background: var(--startup-detail-bg);
      }

      .startup-shell-sidebar::before,
      .startup-shell-main::before,
      .startup-shell-detail::before {
        content: "";
        display: block;
        height: var(--startup-toolbar-height);
        border-bottom: 1px solid var(--startup-muted-border);
      }

      @media (max-width: 1180px) {
        .startup-shell-window {
          grid-template-columns: 200px minmax(0, 1fr) 280px;
        }
      }

      @media (max-width: 980px) {
        .startup-shell-window {
          grid-template-columns: 180px minmax(0, 1fr);
          grid-template-rows: 65dvh 1fr;
        }
        .startup-shell-detail {
          grid-column: 1 / -1;
        }
      }

      @media (max-width: 640px) {
        .startup-shell-window {
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: 160px 1fr 160px;
        }
      }
    </style>
  </head>
  <body>
    <div id="startup-shell" aria-hidden="true">
      <div class="startup-shell-window">
        <div class="startup-shell-sidebar"></div>
        <div class="startup-shell-main"></div>
        <div class="startup-shell-detail"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

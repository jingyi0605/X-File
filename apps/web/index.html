<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/x-file-logo.svg" />
    <title>X-File</title>
    <style>
      :root {
        color-scheme: light;
        --startup-bg: #ececeb;
        --startup-window-bg:
          radial-gradient(circle at top left, rgba(255, 255, 255, 0.5), transparent 24%),
          linear-gradient(180deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.02)),
          var(--startup-bg);
        --startup-sidebar-bg:
          linear-gradient(180deg, rgba(255, 255, 255, 0.26), rgba(255, 255, 255, 0.08)),
          rgba(241, 244, 250, 0.7);
        --startup-detail-bg:
          linear-gradient(180deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.07)),
          rgba(244, 246, 250, 0.74);
        --startup-main-bg: #fcfcfb;
        --startup-border: rgba(24, 24, 27, 0.08);
        --startup-muted-border: rgba(24, 24, 27, 0.06);
        --startup-panel-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.34);
      }

      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--startup-bg);
      }

      body {
        font-family: "SF Pro Text", "SF Pro SC", "PingFang SC", "Helvetica Neue", -apple-system, BlinkMacSystemFont, sans-serif;
      }

      #startup-shell {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        grid-template-rows: 1fr;
        pointer-events: none;
        background:
          radial-gradient(circle at top left, rgba(255, 255, 255, 0.46), transparent 28%),
          linear-gradient(180deg, rgba(255, 255, 255, 0.28), transparent 18%),
          var(--startup-bg);
        opacity: 1;
        transition: opacity 160ms ease;
      }

      #startup-shell[data-state="ready"] {
        opacity: 0;
      }

      #startup-shell[data-state="hidden"] {
        display: none;
      }

      .startup-shell-window {
        display: grid;
        grid-template-columns: 272px minmax(420px, 1fr) 340px;
        width: 100%;
        height: 100%;
        min-height: 0;
        overflow: hidden;
        background: var(--startup-window-bg);
      }

      .startup-shell-sidebar,
      .startup-shell-detail {
        min-height: 0;
        box-shadow: var(--startup-panel-shadow);
        backdrop-filter: blur(28px) saturate(165%);
        -webkit-backdrop-filter: blur(28px) saturate(165%);
      }

      .startup-shell-sidebar {
        border-right: 1px solid var(--startup-border);
        background: var(--startup-sidebar-bg);
      }

      .startup-shell-main {
        min-height: 0;
        background: var(--startup-main-bg);
      }

      .startup-shell-detail {
        border-left: 1px solid var(--startup-border);
        background: var(--startup-detail-bg);
      }

      .startup-shell-sidebar::before,
      .startup-shell-main::before,
      .startup-shell-detail::before {
        content: "";
        display: block;
        height: 54px;
        border-bottom: 1px solid var(--startup-muted-border);
      }

      @media (max-width: 1180px) {
        .startup-shell-window {
          grid-template-columns: 280px minmax(420px, 1fr) 320px;
        }
      }
    </style>
  </head>
  <body>
    <div id="startup-shell" aria-hidden="true">
      <div class="startup-shell-window">
        <div class="startup-shell-sidebar"></div>
        <div class="startup-shell-main"></div>
        <div class="startup-shell-detail"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

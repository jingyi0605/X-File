name: desktop-build-and-release

# X-File 桌面跨平台打包与发布。
# 手动运行时要求仓库中的 VERSION 已经提交并通过 version:check；发布按钮只负责构建、聚合和创建 Release。
# 国内更新源通过仓库 Variables 配置，未配置时保留 GitHub 官方源。

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "构建来源分支、tag 或提交"
        required: true
        default: "main"
        type: string
      publish_release:
        description: "构建成功后创建或更新 GitHub Release"
        required: true
        default: true
        type: boolean
      skip_macos_notarization:
        description: "仅测试时跳过 Apple notarization；应用与 updater 仍保留签名"
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*"

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9.15.4"
  X_FILE_UPDATER_ENDPOINT_STABLE: ${{ vars.X_FILE_UPDATER_ENDPOINT_STABLE }}
  X_FILE_UPDATER_ENDPOINT_BETA: ${{ vars.X_FILE_UPDATER_ENDPOINT_BETA }}
  X_FILE_UPDATER_ASSET_BASE_URL: ${{ vars.X_FILE_UPDATER_ASSET_BASE_URL }}

jobs:
  build-macos-universal:
    name: macos-universal-release
    runs-on: macos-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: 安装 pnpm 和 Node.js
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: 缓存 Rust 构建
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./apps/desktop/src-tauri -> target"
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 检查版本
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            node scripts/version.mjs check --tag "$GITHUB_REF_NAME"
          else
            pnpm version:check
          fi
      - name: 导入 Apple 签名证书
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$APPLE_CERTIFICATE_P12_BASE64" && -n "$APPLE_CERTIFICATE_PASSWORD" && -n "$APPLE_KEYCHAIN_PASSWORD" ]] || {
            echo "缺少 Apple 签名证书 secrets" >&2
            exit 1
          }
          cert_path="$RUNNER_TEMP/x-file-signing-cert.p12"
          keychain_path="$RUNNER_TEMP/x-file-signing.keychain-db"
          export cert_path
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          Path(os.environ["cert_path"]).write_bytes(base64.b64decode(os.environ["APPLE_CERTIFICATE_P12_BASE64"]))
          PY
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$cert_path" -k "$keychain_path" -P "$APPLE_CERTIFICATE_PASSWORD" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$keychain_path" login.keychain-db
          security default-keychain -d user -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"
      - name: 构建 macOS universal 安装包
        env:
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          X_FILE_UPDATER_PUBLIC_KEY: ${{ secrets.X_FILE_UPDATER_PUBLIC_KEY }}
          X_FILE_REQUIRE_RELEASE_SECRETS: "1"
          X_FILE_SKIP_NOTARIZATION: ${{ inputs.skip_macos_notarization && '1' || '0' }}
        shell: bash
        run: bash scripts/package-desktop.sh macos
      - name: 上传 macOS 产物
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-universal
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/macos-release/X-File.dmg
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.sig

  build-windows-x86_64:
    name: windows-x86_64-release
    runs-on: windows-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
      - name: 安装 pnpm 和 Node.js
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: 缓存 Rust 构建
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./apps/desktop/src-tauri -> target"
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 检查版本
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            node scripts/version.mjs check --tag "$GITHUB_REF_NAME"
          else
            pnpm version:check
          fi
      - name: 构建 Windows 安装包
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          X_FILE_UPDATER_PUBLIC_KEY: ${{ secrets.X_FILE_UPDATER_PUBLIC_KEY }}
          X_FILE_REQUIRE_RELEASE_SECRETS: "1"
        shell: bash
        run: bash scripts/package-desktop.sh windows
      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x86_64
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.sig
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.sig

  build-linux-x86_64:
    name: linux-x86_64-release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
      - name: 安装 Linux 打包依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: 安装 pnpm 和 Node.js
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: 缓存 Rust 构建
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./apps/desktop/src-tauri -> target"
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 检查版本
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            pnpm version:check -- --tag "$GITHUB_REF_NAME"
          else
            pnpm version:check
          fi
      - name: 构建 Linux 安装包
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          X_FILE_UPDATER_PUBLIC_KEY: ${{ secrets.X_FILE_UPDATER_PUBLIC_KEY }}
          X_FILE_LINUX_TARGET: x86_64-unknown-linux-gnu
          X_FILE_REQUIRE_RELEASE_SECRETS: "1"
        shell: bash
        run: bash scripts/package-desktop.sh linux
      - name: 上传 Linux 产物
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-x86_64
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*
            apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm

  publish-release:
    name: publish-release
    if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.publish_release == true }}
    needs:
      - build-macos-universal
      - build-windows-x86_64
      - build-linux-x86_64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: release
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
      - name: 安装 Python 依赖
        run: python3 --version
      - name: 下载三平台产物
        uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: 检查版本
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            node scripts/version.mjs check --tag "$GITHUB_REF_NAME"
          else
            node scripts/version.mjs check
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if [[ "$version" == *-* ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
          fi
      - name: 创建或更新 GitHub Release 并生成更新清单
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ASSET_BASE_URL: ${{ env.X_FILE_UPDATER_ASSET_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          tag_name="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE:-}" != "tag" ]]; then
            tag_name="v${VERSION}"
          fi
          release_target="$(git rev-parse HEAD)"
          echo "RELEASE_TAG=$tag_name" >> "$GITHUB_ENV"
          echo "RELEASE_TARGET=$release_target" >> "$GITHUB_ENV"

          if ! gh release view "$tag_name" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$tag_name" --repo "$GH_REPO" --target "$release_target" --title "$tag_name" --notes "X-File $tag_name 桌面发布产物。" --prerelease="$IS_PRERELEASE"
          else
            gh release edit "$tag_name" --repo "$GH_REPO" --prerelease="$IS_PRERELEASE"
          fi

          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path("release-assets")
          repo = os.environ["GH_REPO"]
          tag = os.environ["RELEASE_TAG"]
          asset_base = os.environ.get("ASSET_BASE_URL", "").strip().rstrip("/")

          def first(patterns):
              for pattern in patterns:
                  matches = sorted(root.rglob(pattern))
                  if matches:
                      return matches[0]
              raise SystemExit(f"缺少发布文件：{patterns}")

          def github_url(path):
              return f"https://github.com/{repo}/releases/download/{tag}/{path.name}"

          def mirror_url(path):
              if not asset_base:
                  return github_url(path)
              base = asset_base.replace("{tag}", tag)
              return f"{base}/{path.name}"

          mac = first(["*.app.tar.gz"])
          mac_sig = first(["*.app.tar.gz.sig"])
          win = first(["*.exe"])
          win_sig = first(["*.exe.sig"])
          linux = first(["*.AppImage.tar.gz", "*.AppImage"])
          linux_sig = first(["*.AppImage.tar.gz.sig", "*.AppImage.sig"])
          release_info = json.loads(subprocess.check_output(["gh", "release", "view", tag, "--repo", repo, "--json", "body,publishedAt"], text=True))
          base_manifest = {
              "version": os.environ["VERSION"],
              "notes": release_info.get("body") or "",
              "pub_date": release_info.get("publishedAt"),
              "platforms": {
                  "macos-universal": {"signature": mac_sig.read_text(encoding="utf-8").strip()},
                  "windows-x86_64": {"signature": win_sig.read_text(encoding="utf-8").strip()},
                  "linux-x86_64": {"signature": linux_sig.read_text(encoding="utf-8").strip()},
              },
          }
          official_manifest = json.loads(json.dumps(base_manifest))
          mirror_manifest = json.loads(json.dumps(base_manifest))
          for name, artifact in [("macos-universal", mac), ("windows-x86_64", win), ("linux-x86_64", linux)]:
              official_manifest["platforms"][name]["url"] = github_url(artifact)
              mirror_manifest["platforms"][name]["url"] = mirror_url(artifact)
          (root / "latest.json").write_text(json.dumps(official_manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          (root / "latest-cn.json").write_text(json.dumps(mirror_manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          (root / "release-manifest.json").write_text(json.dumps({"version": os.environ["VERSION"], "tag": tag, "manifest": official_manifest, "mirrorManifest": mirror_manifest}, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("latest.json、latest-cn.json 和 release-manifest.json 生成完成")
          PY
      - name: 上传版本 Release 资产
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d "" files < <(find release-assets -type f \( -name "*.dmg" -o -name "*.msi" -o -name "*.exe" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.tar.gz" -o -name "*.sig" -o -name "*.json" \) -print0)
          [[ "${#files[@]}" -gt 0 ]] || { echo "没有可上传的 Release 资产" >&2; exit 1; }
          gh release upload "$RELEASE_TAG" "${files[@]}" --repo "$GH_REPO" --clobber
      - name: 更新 beta-latest 指针
        if: ${{ env.IS_PRERELEASE == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete beta-latest --yes --cleanup-tag --repo "$GH_REPO" || true
          gh release create beta-latest --target "$RELEASE_TARGET" --prerelease --title "开发版（最新）" --notes "X-File 最新开发版更新清单指针。" --repo "$GH_REPO"
          gh release upload beta-latest release-assets/latest.json release-assets/latest-cn.json release-assets/release-manifest.json --repo "$GH_REPO" --clobber
